<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareEye - Stock News Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: linear-gradient(135deg, #1e90ff 0%, #0099ff 100%);
            --primary-dark: #0099ff;
            --secondary: linear-gradient(135deg, #00d4ff 0%, #00ffff 100%);
            --accent: #00ff88;
            --dark: #0a0e1a;
            --light: #1a1f35;
            --card-bg: #141824;
            --text: #e8eef5;
            --text-muted: #8892b0;
            --success: #00ff88;
            --error: #ff4466;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: var(--text);
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(30, 144, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(0, 212, 255, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(30px, -30px); }
            50% { transform: translate(-20px, 20px); }
            75% { transform: translate(20px, 10px); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            margin-bottom: 40px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 32px;
            font-weight: 800;
            background: var(--primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            transition: var(--transition);
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            border-radius: 50%;
            color: white;
            font-weight: bold;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--success); }
            50% { opacity: 0.7; box-shadow: 0 0 0 8px rgba(0, 255, 135, 0.2); }
        }

        .refresh-btn {
            padding: 10px 20px;
            background: var(--primary);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            font-size: 14px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .refresh-btn.loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Main Title */
        .main-title {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 10px;
            background: var(--secondary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .filter-btn {
            padding: 8px 16px;
            background: var(--light);
            border: 2px solid transparent;
            border-radius: 20px;
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 600;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary-dark);
            border-color: var(--accent);
            color: white;
            transform: translateY(-2px);
        }

        /* News Grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(0, 153, 255, 0.2);
            display: flex;
            flex-direction: column;
            animation: cardAppear 0.6s ease-out forwards;
            opacity: 0;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .news-card:nth-child(1) { animation-delay: 0.1s; }
        .news-card:nth-child(2) { animation-delay: 0.15s; }
        .news-card:nth-child(3) { animation-delay: 0.2s; }
        .news-card:nth-child(4) { animation-delay: 0.25s; }
        .news-card:nth-child(5) { animation-delay: 0.3s; }
        .news-card:nth-child(6) { animation-delay: 0.35s; }
        .news-card:nth-child(n+7) { animation-delay: 0.4s; }

        .news-card:hover {
            transform: translateY(-12px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(30, 144, 255, 0.15), 0 0 30px rgba(0, 255, 136, 0.1);
        }

        .news-image-container {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(30, 144, 255, 0.2), rgba(0, 212, 255, 0.2));
        }

        .news-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .news-card:hover .news-image {
            transform: scale(1.1);
        }

        .news-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: white;
            z-index: 2;
        }

        .news-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .news-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.4;
            color: white;
            transition: var(--transition);
        }

        .news-card:hover .news-title {
            color: var(--accent);
        }

        .news-description {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.5;
            flex-grow: 1;
        }

        .news-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 153, 255, 0.1);
            font-size: 12px;
        }

        .news-source {
            color: var(--accent);
            font-weight: 600;
        }

        .news-time {
            color: var(--text-muted);
        }

        .read-more {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 153, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--accent);
            font-weight: 600;
            font-size: 12px;
            transition: var(--transition);
        }

        .read-more:hover {
            transform: translateX(5px);
        }

        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 153, 255, 0.2);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid rgba(0, 153, 255, 0.1);
            margin-top: 40px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-title {
                font-size: 32px;
            }

            .news-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .header-content {
                justify-content: center;
                text-align: center;
            }

            .logo {
                font-size: 24px;
            }

            .refresh-btn {
                width: 100%;
            }

            .filter-bar {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }

            .main-title {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .news-card {
                border-radius: 12px;
            }

            .news-content {
                padding: 16px;
            }

            .filter-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-dark);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">📈</div>
                    <span>ShareEye</span>
                </div>
                <div class="header-info">
                    <div class="status-indicator"></div>
                    <span id="last-update">Aktualisierung...</span>
                </div>
                <button class="refresh-btn" id="refresh-btn">🔄 Aktualisieren</button>
            </div>
            <h1 class="main-title">Aktuelle Börsen­news</h1>
            <p class="subtitle">Die heißesten Geschichten rund um Aktien, Märkte und Trading</p>
        </header>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">Alle</button>
            <button class="filter-btn" data-filter="trending">🔥 Trending</button>
            <button class="filter-btn" data-filter="tech">💻 Tech</button>
            <button class="filter-btn" data-filter="market">📊 Markt</button>
            <button class="filter-btn" data-filter="crypto">₿ Krypto</button>
        </div>

        <div id="news-container" class="news-grid">
            <div class="loading">
                <div class="loader"></div>
            </div>
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
            <div class="empty-icon">📡</div>
            <h2>Keine News gefunden</h2>
            <p>Versuche später erneut zu aktualisieren</p>
        </div>
    </div>

    <footer>
        <p>ShareEye © 2025 | Deine tägliche Dosis Börsenfieber 📊✨</p>
    </footer>

    <script>
        const newsContainer = document.getElementById('news-container');
        const refreshBtn = document.getElementById('refresh-btn');
        const lastUpdateEl = document.getElementById('last-update');
        const emptyState = document.getElementById('empty-state');
        const filterBtns = document.querySelectorAll('.filter-btn');

        let allNews = [];

        // Fetch News on Load
        async function loadNews() {
            refreshBtn.classList.add('loading');
            newsContainer.style.opacity = '0.6';

            try {
                const response = await fetch('/api/news');
                const news = await response.json();
                allNews = news;
                renderNews(news);
                updateLastUpdate();
            } catch (error) {
                console.error('Error loading news:', error);
                newsContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><h2>Fehler beim Laden</h2></div>';
            } finally {
                refreshBtn.classList.remove('loading');
                newsContainer.style.opacity = '1';
            }
        }

        function renderNews(news) {
            if (news.length === 0) {
                newsContainer.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            newsContainer.innerHTML = news.map((item, index) => {
                const encodedUrl = encodeURIComponent(item.url);
                return `
                <a href="${item.url}" target="_blank" class="news-card" style="animation-delay: ${index * 0.05}s; text-decoration: none; color: inherit;">
                    <div class="news-image-container">
                        <img src="${item.image}" alt="${item.title}" class="news-image" onerror="this.src='https://images.unsplash.com/photo-1611974789855-9c2dc5810803?w=400&h=300&fit=crop'">
                        <div class="news-badge">${item.source.substring(0, 15)}</div>
                    </div>
                    <div class="news-content">
                        <div>
                            <h3 class="news-title">${escapeHtml(item.title)}</h3>
                            <p class="news-description">${escapeHtml(item.description)}</p>
                        </div>
                        <div class="news-footer">
                            <span class="news-source">📰 ${item.source.substring(0, 20)}</span>
                            <span class="news-time">${item.date}</span>
                        </div>
                        <div class="read-more">
                            Mehr lesen <span>→</span>
                        </div>
                    </div>
                </a>
            `;
            }).join('');
        }

        function updateLastUpdate() {
            const now = new Date();
            const time = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            lastUpdateEl.textContent = `Aktualisiert: ${time}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event Listeners
        refreshBtn.addEventListener('click', loadNews);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filter = btn.dataset.filter;
                if (filter === 'all') {
                    renderNews(allNews);
                } else {
                    const filtered = allNews.filter(news => 
                        news.title.toLowerCase().includes(filter) || 
                        news.description.toLowerCase().includes(filter)
                    );
                    renderNews(filtered);
                }
            });
        });

        // Auto-refresh every 5 minutes
        setInterval(loadNews, 5 * 60 * 1000);

        // Load on page load
        loadNews();
    </script>
</body>
</html>
